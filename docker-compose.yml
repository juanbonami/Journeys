services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: journeys
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7
    # Persistence + no eviction: an evicting Redis silently drops delayed jobs.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
  mailpit:
    image: axllent/mailpit
    ports: ["1025:1025", "8025:8025"]   # SMTP, web UI
volumes:
  pgdata:
  redisdata:
